<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="一座可以用角色自由探索的像素個人網站。">
  <meta name="theme-color" content="#071b20">
  <title>我的像素世界｜像素 RPG 個人網站</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#world">跳到像素世界</a>

  <main id="world" class="world-page">
    <section class="world-intro" aria-labelledby="worldTitle">
      <h1 id="worldTitle">我的像素世界</h1>
    </section>

    <section class="game-frame" aria-label="可探索的像素工作室">
      <div class="frame-topbar">
        <span>ROOM_MAP.EXE</span>
        <span class="frame-live"><i></i> ONLINE</span>
      </div>

      <div class="game-viewport">
        <div id="game-root" role="application" aria-label="俯視角像素地圖。使用 WASD 或方向鍵移動，E 鍵互動。"></div>

        <div class="map-legend" aria-hidden="true">
          <span><i class="legend-player"></i>YOU</span>
          <span><i class="legend-object"></i>INTERACT</span>
        </div>

        <div class="interaction-prompt" id="interactionPrompt" hidden>
          <kbd>E</kbd>
          <span id="interactionText">互動</span>
        </div>

        <div class="mobile-controls" aria-label="觸控操作">
          <div class="dpad">
            <button type="button" data-direction="up" aria-label="向上移動">▲</button>
            <button type="button" data-direction="left" aria-label="向左移動">◀</button>
            <button type="button" data-direction="down" aria-label="向下移動">▼</button>
            <button type="button" data-direction="right" aria-label="向右移動">▶</button>
          </div>
          <button class="interact-button" id="mobileInteract" type="button"><span>A</span>互動</button>
        </div>
      </div>

      <div class="frame-footer">
        <span>MOVE: WASD / ARROWS</span>
        <span>INTERACT: E / ENTER</span>
        <span class="visited-counter">DISCOVERED <b id="visitedCount">0</b>/6</span>
      </div>
    </section>

  </main>

  <dialog class="content-dialog" id="contentDialog">
    <div class="dialog-window">
      <header class="dialog-titlebar">
        <div>
          <span class="dialog-icon" id="dialogIcon" aria-hidden="true">■</span>
          <span id="dialogTitle">內容</span>
        </div>
        <button class="window-close" id="closeDialog" type="button" aria-label="關閉視窗">×</button>
      </header>
      <div class="dialog-body" id="dialogBody"></div>
      <footer class="dialog-footer">
        <span id="dialogPath">C:\ROOM\</span>
        <span>ESC CLOSE</span>
      </footer>
    </div>
  </dialog>

  <dialog class="menu-dialog" id="menuDialog">
    <div class="menu-panel">
      <header>
        <div><span class="menu-pixel">◆</span><h2>快速選單</h2></div>
        <button id="closeMenu" type="button" aria-label="關閉快速選單">×</button>
      </header>
      <p>直接選擇目的地，或回到地圖慢慢探索。</p>
      <div class="menu-grid">
        <button type="button" data-open-object="computer"><span>01</span><b>桌上電腦</b><small>技術與設計分析</small></button>
        <button type="button" data-open-object="whiteboard"><span>02</span><b>設計白板</b><small>理念與製作流程</small></button>
        <button type="button" data-open-object="bookshelf"><span>03</span><b>書架</b><small>關於這個世界</small></button>
        <button type="button" data-open-object="projects"><span>04</span><b>工作桌</b><small>專案與下一步</small></button>
        <button type="button" data-open-object="arcade"><span>05</span><b>復古街機</b><small>像素接星星</small></button>
        <button type="button" data-open-object="phone"><span>06</span><b>聯絡終端</b><small>網站與 GitHub</small></button>
      </div>
    </div>
  </dialog>

  <dialog class="help-dialog" id="helpDialog">
    <div class="help-panel">
      <button id="closeHelp" type="button" aria-label="關閉操作說明">×</button>
      <p class="eyebrow">HOW TO PLAY</p>
      <h2>探索操作</h2>
      <dl>
        <div><dt>移動</dt><dd>WASD 或方向鍵</dd></div>
        <div><dt>互動</dt><dd>E、Enter 或空白鍵</dd></div>
        <div><dt>滑鼠</dt><dd>直接點擊地圖物件</dd></div>
        <div><dt>手機</dt><dd>使用畫面方向鍵與 A 鍵</dd></div>
        <div><dt>關閉</dt><dd>Esc 或視窗右上角 ×</dd></div>
      </dl>
      <button class="primary-action" id="startExploring" type="button">開始探索</button>
    </div>
  </dialog>

  <noscript>
    <div class="noscript-message">這個互動地圖需要 JavaScript。請啟用 JavaScript 後重新整理。</div>
  </noscript>

  <script src="./phaser.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
